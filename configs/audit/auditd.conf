# CachyOS Enterprise Hardening - auditd baseline
# Active hardening-relevant settings; package defaults are omitted.

# record enrichment
log_format = ENRICHED

# retention: 30 MB x 10 files, rotate on size
log_file = /var/log/audit/audit.log
log_group = audit
max_log_file = 30
num_logs = 10
max_log_file_action = ROTATE

# write cadence
flush = INCREMENTAL_ASYNC
freq = 30

# userspace event queue (buffered events before disk write)
q_depth = 2000
overflow_action = SYSLOG

# disk-pressure policy: warn early, never halt the system
space_left = 75
space_left_action = SYSLOG
admin_space_left = 50
admin_space_left_action = SUSPEND
disk_full_action = SUSPEND
disk_error_action = SUSPEND