# ------------------------------------------------------------------------------
# CachyOS Enterprise Hardening - Ring 0 (Kernel & Sysctl Parameters)
# Standard: Custom baseline mapping to Lynis & CIS benchmarks
# ------------------------------------------------------------------------------

# === 1. MEMORY & KERNEL PROTECTIONS ===

# Prevents kernel address leakage, mitigating kASLR (Kernel Address Space Layout Randomization) bypasses.
kernel.kptr_restrict = 2

# Restricts dmesg access to root-only, preventing unprivileged users from gathering kernel exploit vectors.
kernel.dmesg_restrict = 1

# Ptrace Scope: Allows process tracing only for direct children. 
# Trade-off: Secures against memory injection while maintaining IDE/Pentesting tool functionality.
kernel.yama.ptrace_scope = 1

# Disables loading of line disciplines by unprivileged users to mitigate local privilege escalations.
dev.tty.ldisc_autoload = 0

# Anti-Rootkit: Disables kexec to prevent warm-reboot replacement of the running kernel.
kernel.kexec_load_disabled = 1

# Compatibility Exception: Enables executable anonymous memory (memfd).
# Required by modern rootless container runtimes (crun/Podman) for initialization without root privileges.
vm.memfd_noexec = 0


# === 2. FILE SYSTEM & INTEGRITY ===

# Disables core dumps entirely. Prevents extraction of credentials or sensitive data from RAM post-crash.
kernel.core_pattern = /dev/null
fs.suid_dumpable = 0

# Enforces strict restrictions on symlinks and hardlinks.
# Mitigates Time-of-Check to Time-of-Use (TOCTOU) vulnerabilities, especially in world-writable dirs like /tmp.
fs.protected_fifos = 2
fs.protected_regular = 2
fs.protected_symlinks = 1
fs.protected_hardlinks = 1

# Disables Magic SysRq keys to prevent physical attack vectors (e.g., forced reboots, memory dumps).
kernel.sysrq = 0

# === 3. NETWORK HARDENING & ROUTING ===

# Exception: Enables IP forwarding. 
# Required for Virtual Machine NAT routing and authorized network pivoting during security assessments.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Reverse Path Filtering: Set to Loose (2) rather than Strict (1).
# Trade-off: Prevents dropping asymmetric routing packets typical in SDN environments (Tailscale) and decoy scanning operations.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Disables ICMP redirect acceptance and transmission to mitigate Man-in-the-Middle (MITM) routing attacks.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Enables logging of spoofed packets, source-routed packets, and redirect packets (Martians).
# Hardware Agnostic: Applied to 'all' and 'default' to ensure inheritance by dynamically created interfaces (e.g., VPN tuns).
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Enables TCP SYN cookies to mitigate SYN flood Denial of Service (DoS) attacks.
net.ipv4.tcp_syncookies = 1

# Enforces iptables (UFW) rule evaluation for bridged IPv4 traffic.
# DEPENDENCY: Requires 'br_netfilter' kernel module to be loaded.
net.bridge.bridge-nf-call-iptables = 1


# === 4. EBPF & JIT COMPILED FILTERS ===

# Enables eBPF JIT hardening to mitigate heap spraying.
# Value 2 requires root privileges to compile BPF filters, maintaining compatibility for privileged network analyzers (Wireshark/Nmap).
net.core.bpf_jit_harden = 2

# Strictly disables unprivileged use of eBPF.
# eBPF sensors (e.g., Falco) will continue to operate as they are executed by root.
kernel.unprivileged_bpf_disabled = 1


# === 5. SYSTEM RESOURCE & PERFORMANCE BOUNDARIES ===

# Exception: Enables unprivileged user namespaces. 
# Essential core functionality for rootless containers and Flatpak sandboxing.
kernel.unprivileged_userns_clone = 1

# Increases network device backlog queue to prevent packet drops during high-throughput network stress testing.
net.core.netdev_max_backlog = 5000

# Ignores bogus ICMP error responses to prevent log flooding and resource exhaustion.
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Restricts unprivileged access to performance events and CPU hardware counters (Mitigates side-channel attacks).
kernel.perf_event_paranoid = 2
