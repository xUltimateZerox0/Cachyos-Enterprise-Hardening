# CachyOS Enterprise Hardening - AIDE Monitoring Configuration
# Baseline pattern: placeholders replace local values
# (<USER_HOME> desktop user, <GAME_HOME> gaming session, <LAB_DIR> lab store).

database_in=file:/var/lib/aide/aide.db.gz
database_out=file:/var/lib/aide/aide.db.new.gz

num_workers=8
gzip_dbout=yes

log_level=warning
report_level=changed_attributes
warn_dead_symlinks=yes

# Forensic persistence
report_append=yes
report_url=stdout
report_url=syslog:LOG_LOCAL0
report_url=file:/var/log/aide.log

# ==============================================================================
# 1. MACRO
# ==============================================================================
# Attribute taxonomy: NOVACORE/NOVAUSR hash immutable content (sha512);
# NOVAMETA/NOVASVC track metadata only for runtime-generated files;
# NOVAFAT is the minimal set supported by the VFAT ESP.

NOVACORE = ftype+p+i+l+n+u+g+s+m+c+acl+xattrs+e2fsattrs+caps+sha512
NOVAUSR  = ftype+p+l+n+u+g+s+m+acl+xattrs+e2fsattrs+caps+sha512
NOVAFAT  = ftype+s+m+sha512
NOVALINK = ftype+p+i+l+n+u+g+m+c
NOVAUSER = ftype+p+l+u+g+s+m+c+e2fsattrs+caps+sha512
NOVAMETA = ftype+p+l+n+u+g+s+m+acl+xattrs+e2fsattrs+caps
NOVASVCH = ftype+p+l+n+u+g+s+acl+xattrs+e2fsattrs+caps+sha512
NOVASVC  = ftype+p+l+n+u+g+s+acl+xattrs+e2fsattrs+caps
NOVADIR  = ftype+p+n+u+g

# ==============================================================================
# 2. EXCEPTIONS
# ==============================================================================
# Volatile or package-managed paths: their rewrite churn is expected and
# would otherwise alarm at every scan (MTREE-based checks cover the rest).

!/usr/lib/modules($|/.*)
!/usr/src($|/.*)
!/usr/lib/debug($|/.*)
!/usr/share/fonts/.*cache.*
!/opt/<LAB_DIR>($|/.*)
!/etc/pacman\.d/(mirrorlist|cachyos-.*mirrorlist)($|/.*)
!/etc/(passwd|shadow|group|gshadow|subuid|subgid)-$
!/etc/.*\.pacnew$
!/etc/.*\.pacsave$
!/etc/.*~$
!/etc/.*\.old$
!/etc/ld\.so\.cache$
!/etc/mtab$
!/etc/adjtime$
!/etc/resolv\.conf$
!/boot/grub/grubenv$
!/boot/grub/grub-btrfs\.cfg$
!/etc/\.updated$
!/etc/dnscrypt-proxy/blocked-names\.txt$
!/etc/pacman\.d/gnupg/S\..*$
!/etc/pacman\.d/gnupg/\.#.*$
!/usr/share/applications/mimeinfo\.cache$

# ==============================================================================
# 3. CRITICAL DIRECTORIES + PERSISTENCE (CRON)
# ==============================================================================
# NOVACORE adds inode/ctime for /etc (tamper-resistance); NOVAUSR omits
# them under /usr (package updates rewrite every file). The configs of
# laptop control-plane daemons (ASUS EC, GPU switcher) are monitored by
# volatility: metadata-only for runtime-rewritten, hashed for static ones.

/boot                                              NOVAFAT
/boot/grub$                                        NOVADIR
/bin                                               NOVALINK
/sbin                                              NOVALINK
/lib                                               NOVALINK
/lib64                                             NOVALINK
/etc$                                              NOVADIR
/etc                                               NOVACORE
/etc/asusd/aura_tuf.ron                            NOVASVCH
/etc/asusd/fan_curves.ron                          NOVASVCH
/etc/supergfxd.conf                                NOVASVCH
/etc/modprobe.d/supergfxd.conf                     NOVASVCH
/etc/asusd/asusd.ron                               NOVASVC
/etc/asusd$                                        NOVADIR
/etc/pacman\.d/gnupg$                              NOVADIR
/usr/lib/systemd/system                            NOVAUSR
/usr/share/libalpm/hooks                           NOVAUSR
/usr/share/applications                            NOVAUSR
/usr/share/dbus-1                                  NOVAUSR
/usr/share/polkit-1/actions                        NOVAUSR
/usr/bin                                           NOVAUSR
/usr/sbin                                          NOVAUSR
/usr/lib                                           NOVAUSR
/usr/libexec                                       NOVAUSR
/usr/local/bin                                     NOVAUSR
/usr/local/sbin                                    NOVAUSR
/usr/local/lib                                     NOVAUSR
/opt                                               NOVAUSR
/opt/cuda                                          NOVAMETA
/var/spool/cron                                    NOVAUSR
/var/lib/pacman/local                              NOVAUSR

# ==============================================================================
# 4. LIVING-OFF-THE-LAND (repeat the account entries per user on the system)
# ==============================================================================

/root/\.ssh($|/.*)                                 NOVAUSER
/root/\.zshrc$                                     NOVALINK
/home/<USER_HOME>/\.ssh($|/.*)                     NOVAUSER
/home/<USER_HOME>/\.local/share/applications($|/.*)   NOVAUSER
/home/<USER_HOME>/\.config/autostart($|/.*)        NOVAUSER
/home/<USER_HOME>/\.config/systemd/user($|/.*)     NOVAUSER
/home/<USER_HOME>/\.zshrc$                         NOVAUSER

