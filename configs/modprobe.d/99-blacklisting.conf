# ------------------------------------------------------------------------------
# CachyOS Enterprise Hardening - Kernel Module Blacklisting
# Standard: CIS Linux Benchmark & DISA STIG
# ------------------------------------------------------------------------------


# === 3. ARCHITECTURAL EXCEPTIONS (Documented) ===
# 1. 'squashfs' is explicitly NOT disabled. It is required for Flatpak/AppImage.
# 2. 'usb-storage' and 'vfat' are NOT disabled. Physical USB security is 
#    delegated to USBGuard (MAC-based peripheral authorization) rather than 
#    crippling the bus entirely.
# NOTE: We use BOTH 'blacklist' and 'install /bin/true' (Defense-in-Depth).
# - 'blacklist' prevents inclusion in the initramfs boot image.
# - 'install /bin/true' intercepts and neutralizes runtime dependency loading.

# === 1. OBSCURE NETWORK PROTOCOLS ===
# Mitigates local privilege escalation vectors via unmaintained protocol stacks.

blacklist dccp
install dccp /bin/true

blacklist sctp
install sctp /bin/true

blacklist rds
install rds /bin/true

blacklist tipc
install tipc /bin/true

# === 2. LEGACY FILESYSTEMS ===
# Prevents auto-loading of vulnerable modules when malicious images are mounted.

blacklist cramfs
install cramfs /bin/true

blacklist freevxfs
install freevxfs /bin/true

blacklist jffs2
install jffs2 /bin/true

blacklist hfs
install hfs /bin/true

blacklist hfsplus
install hfsplus /bin/true

blacklist udf
install udf /bin/true