# Ring 0 - Kernel Module Blacklisting

# Defense-in-depth: 'blacklist' keeps modules out of initramfs/autoload paths, while 'install ... /bin/true' neutralizes runtime dependency loading (kmod).
# /bin/true is preferred over /bin/false so spurious modprobe "failures" cannot cascade into unrelated services.

# === 1. OBSCURE NETWORK PROTOCOLS ===
# Unmaintained protocol stacks: reduced local attack surface.

blacklist dccp
install dccp /bin/true

blacklist sctp
install sctp /bin/true

blacklist rds
install rds /bin/true

blacklist tipc
install tipc /bin/true

# === 2. LEGACY / OUT-OF-TREE FILESYSTEMS ===
# Prevents auto-loading vulnerable parsers when malicious images are mounted.

blacklist cramfs
install cramfs /bin/true

blacklist freevxfs
install freevxfs /bin/true

blacklist jffs2
install jffs2 /bin/true

blacklist hfs
install hfs /bin/true

blacklist hfsplus
install hfsplus /bin/true

blacklist udf
install udf /bin/true

# === 3. DMA ATTACK SURFACE ===
# FireWire grants DMA access to RAM; the stack is unused on this platform.

blacklist firewire-core
install firewire-core /bin/true
